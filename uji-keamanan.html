
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uji Keamanan Mutabaah UPA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 24px auto;
      padding: 16px;
      line-height: 1.5;
      background: #f5f7fa;
      color: #202733;
    }
    main {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
    input, button, select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 8px;
      background: #175cd3;
      color: white;
      font-weight: bold;
    }
    #hasil {
      overflow-wrap: anywhere;
      padding: 12px;
      background: #eef2f6;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .peringatan { color: #9a3412; }
  </style>
</head>
<body>
<main>
  <h2>Uji Keamanan Mutabaah UPA</h2>
  <p class="peringatan">
    Halaman uji sementara. Gunakan hanya akun dan data uji.
    Jangan bagikan kata sandi kepada siapa pun.
  </p>

  <form id="formLogin">
    <label>Email pembina A</label>
    <input id="email" type="email" required autocomplete="username">

    <label>Kata sandi</label>
    <input id="password" type="password" required
      autocomplete="current-password">

    <button type="submit">Login Pembina A</button>
  </form>

  <p id="akun">Belum login.</p>

  <form id="formUji">
    <label>ID binaan milik Pembina B</label>
    <input id="binaanId" required
      placeholder="Contoh: BIN_TEST_002">

    <label>Catatan uji</label>
    <input id="catatan" required maxlength="2000"
      value="UJI KEAMANAN - catatan ini seharusnya ditolak">

    <button type="submit">Uji Penolakan Firestore</button>
  </form>

  <button id="keluar" type="button">Logout</button>

  <h3>Hasil</h3>
  <div id="hasil">Belum ada pengujian.</div>
</main>

<script type="module">
  import { auth, db } from "./firebase.js";

  import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  const UPA_ID = "UPA_TEST_001";
  const $ = id => document.getElementById(id);
  let sedangUji = false;

  function tampilkan(teks) {
    $("hasil").textContent = teks;
  }

  onAuthStateChanged(auth, user => {
    $("akun").textContent = user
      ? "Login aktif: " + user.email
      : "Belum login.";
  });

  $("formLogin").addEventListener("submit", async event => {
    event.preventDefault();
    try {
      await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("password").value
      );
      $("password").value = "";
      tampilkan("Login berhasil. Pastikan akun ini Pembina A.");
    } catch (error) {
      tampilkan("Login gagal: " + error.code);
    }
  });

  $("formUji").addEventListener("submit", async event => {
    event.preventDefault();

    if (sedangUji) return;
    sedangUji = true;

    try {
      if (!auth.currentUser) {
        tampilkan("Login terlebih dahulu.");
        return;
      }

      const binaanId = $("binaanId").value.trim();
      const catatan = $("catatan").value.trim();

      if (!binaanId || !catatan) {
        tampilkan("ID binaan dan catatan wajib diisi.");
        return;
      }

      const konfirmasi = confirm(
        "Pastikan Anda login sebagai Pembina A dan ID binaan " +
        "ini benar-benar milik Pembina B.\n\n" +
        "Permintaan akan dikirim ke Firestore. Lanjutkan?"
      );

      if (!konfirmasi) {
        tampilkan("Pengujian dibatalkan.");
        return;
      }

      await addDoc(
        collection(db, "upas", UPA_ID, "mutabaah"),
        {
          binaanId,
          tanggal: new Date().toISOString().slice(0, 10),
          jenis: "lainnya",
          catatan,
          pencatatUid: auth.currentUser.uid,
          status: "selesai",
          dibuatPada: serverTimestamp()
        }
      );

      tampilkan(
        "PERHATIAN: Firestore menerima penyimpanan.\n" +
        "Pengujian gagal memenuhi harapan keamanan. " +
        "Segera periksa Rules dan catatan yang masuk."
      );
    } catch (error) {
      if (error.code === "permission-denied") {
        tampilkan(
          "LULUS: Firestore menolak permintaan (permission-denied).\n" +
          "Pembina A tidak diizinkan menyimpan catatan " +
          "untuk binaan Pembina B."
        );
      } else {
        tampilkan(
          "Pengujian belum dapat disimpulkan.\n" +
          "Kode error: " + (error.code || "tidak diketahui") +
          "\nPesan: " + error.message
        );
      }
    } finally {
      sedangUji = false;
    }
  });

  $("keluar").addEventListener("click", async () => {
    try {
      await signOut(auth);
      tampilkan("Logout berhasil.");
    } catch (error) {
      tampilkan("Logout gagal: " + error.code);
    }
  });
</script>
</body>
</html>
